<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071018">
  <title>IC Design Lab — CMOS Inverter WebXR</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="hud">
    <div class="eyebrow">IC DESIGN LAB</div>
    <h1>CMOS Inverter — Meta Quest WebXR</h1>
    <p>
      Desktop: drag to orbit and use the controls below.
      Quest: press <b>ENTER VR</b>, then point with a controller or hand and pinch/trigger to select.
    </p>

    <label class="sliderLabel">
      <span>VIN</span>
      <input id="vin" type="range" min="0" max="1" step="0.01" value="0">
      <strong id="vinValue">0.00 VDD</strong>
    </label>

    <div class="buttonRow">
      <button id="low">VIN Low</button>
      <button id="mid">Transition</button>
      <button id="high">VIN High</button>
    </div>

    <div class="buttonRow">
      <button id="toggleCurrent">Current Path: ON</button>
      <button id="toggleLabels">Labels: ON</button>
    </div>

    <div id="state">PMOS ON · NMOS OFF · VOUT ≈ VDD</div>
    <div id="xrStatus">Checking WebXR support…</div>
  </div>

  <div id="desktopHint">Drag to rotate · wheel to zoom · ENTER VR for Quest</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
